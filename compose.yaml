name: retailpulse

include:
  - compose.streaming.yml

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: retailpulse-airflow:2.10.5
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    RETAILPULSE_AIRFLOW_METADATA: "1"
    # Fallback for `docker compose exec ... airflow`, which bypasses the wrapper.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: python /opt/airflow/src/retailpulse/common/airflow_dsn.py
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?Set AIRFLOW_WEBSERVER_SECRET_KEY in .env}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
    POSTGRES_HOST: postgres
    POSTGRES_USER: ${POSTGRES_USER:-retail}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    SOURCE_DB: ${SOURCE_DB:-source_db}
    WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse_db}
    MINIO_ENDPOINT: minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-retailadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    MINIO_BUCKET: ${MINIO_BUCKET:-retailpulse}
    DATA_DIR: /opt/airflow/data/source
    REDPANDA_BROKER: redpanda:9092
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
    - ./sql:/opt/airflow/sql:ro
    - ./data:/opt/airflow/data
    - ./tests:/opt/airflow/tests:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    profiles: ["core"]
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${SOURCE_DB}
      WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    profiles: ["core"]
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    profiles: ["core"]
    image: retailpulse-airflow:2.10.5
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-retailpulse}
    entrypoint: ["python", "/scripts/create_bucket.py"]
    volumes:
      - ./docker/minio/create_bucket.py:/scripts/create_bucket.py:ro
    restart: "no"

  airflow-directories:
    profiles: ["core"]
    <<: *airflow-common
    user: "0:0"
    environment:
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    entrypoint: /bin/bash
    command:
      - -ec
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/data/source
        chown "$${AIRFLOW_UID}:0" /opt/airflow/logs /opt/airflow/data /opt/airflow/data/source
    volumes:
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
    restart: "no"

  airflow-init:
    profiles: ["core"]
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
      airflow-directories:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    volumes:
      - ./src:/opt/airflow/src
      - ./sql:/opt/airflow/sql:ro
      - ./docker/airflow/init.sh:/scripts/init.sh:ro

    restart: "no"

  airflow-webserver:
    profiles: ["core"]
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    command: webserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    profiles: ["core"]
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  minio_data:
