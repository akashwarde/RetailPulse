name: retailpulse

# Business intelligence profile: Metabase on its OWN small Postgres (it must not share the
# warehouse database, and its metadata survives `make down`).
services:
  metabase-db:
    profiles: ["bi"]
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:-metabase_dev_password}
      POSTGRES_DB: metabase
    volumes:
      - metabase_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    profiles: ["bi"]
    image: metabase/metabase:v0.55.10          # multi-arch (amd64 + arm64)
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabase_dev_password}
      MB_DB_HOST: metabase-db
      JAVA_OPTS: "-Xmx768m"                    # keeps Metabase small enough for 8 GB laptops
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  metabase_db_data:
